# Picobot Alert Rules
#
# Each rule fires when a metric (referenced by dotted path into the snapshot
# returned by /metrics/current) satisfies a comparator-threshold test.
#
# `display_name` (optional) is the human-readable label shown in the UI; the
# raw `name` is still used as the unique identifier and for the API path
# (e.g. `/alerts/rules/{name}/silence`).
#
# `for_seconds` (optional) requires the condition to hold continuously for at
# least N seconds before firing — useful for damping out spikes.
#
# Severity affects UI styling and notification delivery:
#   - info     → UI only
#   - warning  → UI + browser notification
#   - critical → UI + browser notification (red)
#
# To disable a rule without deleting it, set `enabled: false`.

rules:
  - name: high_cpu_sustained
    display_name: CPU 持續過高
    description: CPU 持續高於 80%（超過 5 分鐘）
    severity: warning
    metric_path: system.cpu_percent
    comparator: ">"
    threshold: 80
    for_seconds: 300

  - name: api_5xx_burst
    display_name: API 5xx 錯誤爆量
    description: API 5xx 錯誤比率超過 5%
    severity: critical
    metric_path: api.error_5xx_rate_1h
    comparator: ">"
    threshold: 0.05

  - name: tool_success_drop
    display_name: 工具成功率下降
    description: 工具成功率掉到 80% 以下
    severity: warning
    metric_path: agent.tool_success_rate
    comparator: "<"
    threshold: 0.80

  - name: chrome_down
    display_name: 瀏覽器已停止
    description: 瀏覽器 process 已停止（原本應 alive）
    severity: critical
    metric_path: system.chrome_alive
    comparator: "=="
    threshold: false

  - name: db_size_warn
    display_name: 資料庫過大
    description: sessions.db 超過 5 GB
    severity: warning
    metric_path: system.db_file_bytes
    comparator: ">"
    threshold: 5368709120  # 5 GiB

  - name: subagent_stuck
    display_name: 子代理執行過久
    description: 有 subagent 執行超過 30 分鐘
    severity: warning
    metric_path: subagents.longest_running_seconds
    comparator: ">"
    threshold: 1800

  - name: high_memory
    display_name: 記憶體用量過高
    description: Process RSS 持續超過 1 GB（超過 2 分鐘）
    severity: warning
    metric_path: system.rss_bytes
    comparator: ">"
    threshold: 1073741824  # 1 GiB
    for_seconds: 120

  - name: api_high_latency
    display_name: API 延遲過高
    description: API p95 延遲超過 3 秒
    severity: warning
    metric_path: api.latency_p95_ms
    comparator: ">"
    threshold: 3000
    for_seconds: 60

  - name: subagent_success_drop
    display_name: 子代理成功率下降
    description: 24h 子代理成功率掉到 70% 以下
    severity: warning
    metric_path: subagents.success_rate_24h
    comparator: "<"
    threshold: 0.70

  - name: llm_error_rate
    display_name: LLM API 錯誤率過高
    description: 10 分鐘內 LLM 呼叫錯誤率超過 5%
    severity: critical
    metric_path: llm.error_rate_10m
    comparator: ">"
    threshold: 0.05

  - name: llm_timeout_rate
    display_name: LLM Timeout 率過高
    description: 10 分鐘內 LLM 呼叫 timeout 比率超過 10%
    severity: warning
    metric_path: llm.timeout_rate_10m
    comparator: ">"
    threshold: 0.10

  - name: llm_latency_high
    display_name: LLM 延遲過高
    description: LLM 呼叫 p95 延遲超過 5 秒
    severity: warning
    metric_path: llm.latency_p95_ms
    comparator: ">"
    threshold: 5000
    for_seconds: 60

  - name: llm_ttft_high
    display_name: LLM 首 Token 延遲過高
    description: LLM 首 Token p95 延遲超過 1.5 秒（影響回應感受）
    severity: warning
    metric_path: llm.ttft_p95_ms
    comparator: ">"
    threshold: 1500
    for_seconds: 60
